<title>入庫紀錄查詢台</title>
<style>
:root {
  --paper: #ffffff;
  --ground: #eef1f5;
  --ink: #131a24;
  --ink-2: #4a5768;
  --ink-3: #7d8a9c;
  --line: #d9e0e9;
  --line-soft: #e8edf3;
  --accent: #1f497d;
  --accent-ink: #ffffff;
  --accent-wash: #e6edf7;
  --ok: #16704a;
  --ok-wash: #e2f2ea;
  --warn: #97600b;
  --warn-wash: #fbeed7;
  --alert: #a5241c;
  --alert-wash: #fbe6e4;
  --shadow: 0 1px 2px rgba(19, 26, 36, .06), 0 4px 16px rgba(19, 26, 36, .05);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
          "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171e28; --ground: #0e141c; --ink: #e6ecf3; --ink-2: #a4b1c2;
    --ink-3: #74829a; --line: #2b3644; --line-soft: #222c38;
    --accent: #82aee2; --accent-ink: #0e141c; --accent-wash: #1c2a3b;
    --ok: #6bc79b; --ok-wash: #162a22; --warn: #e0b166; --warn-wash: #2d2416;
    --alert: #e59189; --alert-wash: #301c1a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --paper: #171e28; --ground: #0e141c; --ink: #e6ecf3; --ink-2: #a4b1c2;
  --ink-3: #74829a; --line: #2b3644; --line-soft: #222c38;
  --accent: #82aee2; --accent-ink: #0e141c; --accent-wash: #1c2a3b;
  --ok: #6bc79b; --ok-wash: #162a22; --warn: #e0b166; --warn-wash: #2d2416;
  --alert: #e59189; --alert-wash: #301c1a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
:root[data-theme="light"] {
  --paper: #ffffff; --ground: #eef1f5; --ink: #131a24; --ink-2: #4a5768;
  --ink-3: #7d8a9c; --line: #d9e0e9; --line-soft: #e8edf3;
  --accent: #1f497d; --accent-ink: #ffffff; --accent-wash: #e6edf7;
  --ok: #16704a; --ok-wash: #e2f2ea; --warn: #97600b; --warn-wash: #fbeed7;
  --alert: #a5241c; --alert-wash: #fbe6e4;
  --shadow: 0 1px 2px rgba(19,26,36,.06), 0 4px 16px rgba(19,26,36,.05);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 72px; }

/* ── 頁首 ───────────────────────────────── */
.masthead { padding: 32px 0 20px; }
.masthead h1 {
  margin: 0; font-size: 26px; font-weight: 640; letter-spacing: -.01em;
  text-wrap: balance;
}
.masthead .meta {
  margin-top: 6px; color: var(--ink-3); font-size: 13px;
  font-variant-numeric: tabular-nums;
}

/* ── 控制列 ─────────────────────────────── */
.controls {
  position: sticky; top: 0; z-index: 20;
  background: var(--ground); padding: 10px 0 12px;
  border-bottom: 1px solid var(--line);
}
.searchrow { display: flex; gap: 10px; flex-wrap: wrap; }
.search {
  flex: 1 1 300px; display: flex; align-items: center; gap: 8px;
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 8px; padding: 0 12px; box-shadow: var(--shadow);
}
.search svg { flex: none; color: var(--ink-3); }
.search input {
  flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink);
  font: inherit; padding: 11px 0; min-width: 0;
}
.search input::placeholder { color: var(--ink-3); }
select, .btn {
  background: var(--paper); border: 1px solid var(--line); color: var(--ink);
  border-radius: 8px; padding: 10px 12px; font: inherit; cursor: pointer;
  box-shadow: var(--shadow);
}
select { max-width: 220px; }
.filters {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin-top: 10px;
}
.chip {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink-2);
  border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  white-space: nowrap;
}
.chip[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 560;
}
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
:is(input, select, button, a, summary):focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px;
}

/* ── 統計列 ─────────────────────────────── */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--line-soft); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; margin: 18px 0 24px;
}
.stat { background: var(--paper); padding: 14px 16px; }
.stat .k {
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
}
.stat .val {
  font-size: 23px; font-weight: 620; margin-top: 3px;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.stat.flag .val { color: var(--warn); }

/* ── 日期分組 ───────────────────────────── */
.day { margin-bottom: 22px; }
.day > summary {
  list-style: none; cursor: pointer; display: flex; align-items: baseline;
  gap: 12px; padding: 11px 16px; background: var(--paper);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  position: sticky; top: 118px; z-index: 5;
}
.day[open] > summary { border-radius: 10px 10px 0 0; }
.day > summary::-webkit-details-marker { display: none; }
.day .date {
  font-family: var(--mono); font-size: 15px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.day .wd { color: var(--ink-3); font-size: 13px; }
.day .tally { margin-left: auto; color: var(--ink-2); font-size: 13px;
  font-variant-numeric: tabular-nums; }
.day .caret { color: var(--ink-3); transition: transform .15s; }
.day[open] .caret { transform: rotate(90deg); }

.tablewrap {
  overflow-x: auto; background: var(--paper);
  border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px;
}
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th {
  text-align: left; font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-3); font-weight: 600;
  padding: 9px 12px; border-bottom: 1px solid var(--line);
  background: var(--paper); white-space: nowrap;
}
td {
  padding: 10px 12px; border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}
tr:last-child td { border-bottom: 0; }
tr:hover td { background: var(--accent-wash); }
.num { text-align: right; font-variant-numeric: tabular-nums;
  white-space: nowrap; }
.sku { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.sku .vk { color: var(--ink-3); display: block; font-size: 11.5px; }
.pname { font-weight: 540; }
.pspec { color: var(--ink-3); font-size: 12.5px; margin-top: 1px; }
.doc { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  overflow-wrap: anywhere; min-width: 118px; }

/* 同一天之內的廠商分段標題 */
tr.vsep td {
  background: var(--accent-wash); padding: 7px 12px;
  border-bottom: 1px solid var(--line);
  border-top: 1px solid var(--line);
  position: sticky; left: 0;
}
tr.vsep:first-child td { border-top: 0; }
tr:hover.vsep td { background: var(--accent-wash); }
.vs-name {
  font-size: 13px; font-weight: 640; color: var(--accent);
  letter-spacing: .01em;
}
.vs-tally {
  margin-left: 12px; font-size: 12px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.tag {
  display: inline-block; padding: 2px 8px; border-radius: 5px;
  font-size: 11.5px; font-weight: 560; white-space: nowrap;
  background: var(--ok-wash); color: var(--ok);
}
.tag.warn { background: var(--warn-wash); color: var(--warn); }
.tag.alert { background: var(--alert-wash); color: var(--alert); }
.tag.mute { background: var(--line-soft); color: var(--ink-3); }

.srcbtn {
  display: flex; align-items: center; gap: 5px; padding: 4px 9px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
  color: var(--accent); font-size: 12px; text-decoration: none;
  cursor: pointer; font-family: inherit; text-align: left;
  max-width: 230px; margin-bottom: 4px;
}
.srcbtn:hover { background: var(--accent-wash); border-color: var(--accent); }
.srcbtn.none { color: var(--ink-3); border-style: dashed; cursor: default;
  display: inline-flex; }
.srcbtn.none:hover { background: var(--paper); border-color: var(--line); }
/* 只靠日期猜出來的單據，用虛線邊框跟實際比中的區分開 */
.srcbtn.guess { border-style: dashed; color: var(--warn); }
.srcbtn.guess:hover { background: var(--warn-wash); border-color: var(--warn); }
.guesshint { font-size: 11px; color: var(--warn); margin-bottom: 3px; }
.notewrap { margin-top: 5px; }
.notewrap summary {
  cursor: pointer; font-size: 12px; color: var(--ink-3); list-style: none;
}
.notewrap summary::-webkit-details-marker { display: none; }
.notewrap p {
  margin: 5px 0 0; font-size: 12.5px; color: var(--ink-2);
  max-width: 62ch; padding-left: 10px;
  border-left: 2px solid var(--line);
}

.empty { text-align: center; padding: 64px 20px; color: var(--ink-3); }
.empty strong { display: block; font-size: 17px; color: var(--ink);
  margin-bottom: 6px; }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: var(--ink); color: var(--ground); padding: 11px 18px;
  border-radius: 9px; font-size: 13.5px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: min(90vw, 520px); z-index: 60;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

.localnote {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--warn-wash); color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
  border-radius: 9px; padding: 11px 14px; font-size: 13px; margin-bottom: 18px;
}
.localnote b { font-weight: 620; }

/* ── 鎖定畫面 ───────────────────────────── */
.lock {
  min-height: 100vh; display: flex; align-items: center;
  justify-content: center; padding: 24px;
}
/* display:flex 是作者樣式，會蓋掉 hidden 屬性的 display:none，
   少了這行解鎖後鎖定畫面不會消失 */
.lock[hidden], #app[hidden] { display: none; }
.lockbox {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow);
  padding: 30px 28px; width: 100%; max-width: 400px;
}
.lockbox h1 { margin: 0; font-size: 20px; font-weight: 640;
  letter-spacing: -.01em; }
.lockbox .why { margin: 8px 0 20px; font-size: 13.5px; color: var(--ink-2);
  line-height: 1.55; }
.lockbox label { display: block; font-size: 12px; font-weight: 600;
  color: var(--ink-2); margin-bottom: 6px; letter-spacing: .03em; }
.lockbox input[type="password"] {
  width: 100%; border: 1.5px solid var(--line); border-radius: 9px;
  padding: 12px 13px; font: inherit; font-size: 16px;
  background: var(--paper); color: var(--ink);
}
.lockbox button {
  width: 100%; margin-top: 12px; border: 0; border-radius: 9px;
  padding: 13px; font: inherit; font-size: 15px; font-weight: 620;
  background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.lockbox button[disabled] { opacity: .5; cursor: progress; }
.remember {
  display: flex; align-items: center; gap: 8px; margin-top: 14px;
  font-size: 12.5px; color: var(--ink-2);
}
.remember input { width: 16px; height: 16px; accent-color: var(--accent); }
.lockerr {
  margin-top: 12px; font-size: 13px; color: var(--alert);
  background: var(--alert-wash); border: 1px solid var(--alert);
  border-radius: 8px; padding: 9px 12px; display: none;
}
.lockerr.show { display: block; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media (max-width: 720px) {
  .wrap { padding: 0 14px 56px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .day > summary { top: 150px; }
  select { max-width: 100%; flex: 1 1 140px; }
}
</style>

<div class="lock" id="lock" hidden>
  <form class="lockbox" id="lockform">
    <h1>入庫紀錄查詢台</h1>
    <p class="why">
      這份資料包含廠商進價與金額，內容是加密的。
      輸入密碼才能解開，沒有密碼的人看不到任何內容。
    </p>
    <label for="pw">密碼</label>
    <input id="pw" type="password" autocomplete="current-password"
           autofocus />
    <label class="remember">
      <input id="remember" type="checkbox" />
      在這台裝置記住密碼
    </label>
    <button id="unlock" type="submit">解鎖</button>
    <div class="lockerr" id="lockerr"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="masthead">
    <h1>入庫紀錄查詢台</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="controls">
    <div class="searchrow">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="7" cy="7" r="4.6" /><path d="M10.4 10.4 14 14" />
        </svg>
        <input id="q" type="search" autocomplete="off"
               placeholder="搜尋品名、貨號、單據號碼、備註…"
               aria-label="搜尋入庫紀錄" />
      </label>
      <select id="vendor" aria-label="篩選廠商"></select>
    </div>
    <div class="filters">
      <button class="chip" data-range="7" aria-pressed="false">近 7 天</button>
      <button class="chip" data-range="30" aria-pressed="false">近 30 天</button>
      <button class="chip" data-range="0" aria-pressed="true">全部期間</button>
      <span class="sep"></span>
      <button class="chip" data-status="pending" aria-pressed="false">
        只看待覆核
      </button>
      <button class="chip" data-status="nosrc" aria-pressed="false">
        只看缺單據
      </button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="results"></div>
</div>

<script>
(function () {
  "use strict";
  const PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
  const GENERATED = "2026-08-18 15:50";
  const STORE_KEY = "inbound-query-pw";

  // ── 解密 ────────────────────────────────
  // 頁面裡只有密文。密碼從沒進過這份檔案，破解只能靠暴力猜 PBKDF2。

  function b64bytes(s) {
    const bin = atob(s), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function decryptPayload(pw, payload) {
    const raw = b64bytes(payload.b64);
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), body = raw.slice(28);
    const km = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: payload.iter, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv }, key, body);
    return JSON.parse(new TextDecoder().decode(plain));
  }


  const lock = document.getElementById("lock");
  const app = document.getElementById("app");

  if (!PAYLOAD.encrypted) {
    start(PAYLOAD.data);
  } else if (!window.crypto || !crypto.subtle) {
    // Web Crypto 只在 https 或 localhost 供應
    lock.hidden = false;
    showLockError("這個瀏覽器無法解密（需要 https 連線）。請改用網址列有鎖頭的連結開啟。");
    document.getElementById("lockform").style.display = "none";
  } else {
    lock.hidden = false;
    const saved = (() => {
      try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
    })();
    if (saved) {
      tryUnlock(saved, false);
    }
    document.getElementById("lockform").addEventListener("submit", ev => {
      ev.preventDefault();
      tryUnlock(document.getElementById("pw").value,
                document.getElementById("remember").checked);
    });
  }

  function showLockError(msg) {
    const e = document.getElementById("lockerr");
    e.textContent = msg;
    e.classList.add("show");
  }

  async function tryUnlock(pw, remember) {
    const btn = document.getElementById("unlock");
    document.getElementById("lockerr").classList.remove("show");
    btn.disabled = true;
    btn.textContent = "解密中…";
    try {
      const data = await decryptPayload(pw, PAYLOAD);
      if (remember) {
        try { localStorage.setItem(STORE_KEY, pw); } catch (e) {}
      }
      lock.hidden = true;
      start(data);
    } catch (err) {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      btn.disabled = false;
      btn.textContent = "解鎖";
      showLockError("密碼不對，再試一次。");
      document.getElementById("pw").select();
    }
  }

  function start(DATA) {
    app.hidden = false;
    boot(DATA);
  }

  // ── 主程式 ──────────────────────────────
  function boot(DATA) {
  const VENDORS = DATA.vendors, SRCS = DATA.srcs, ROWS = DATA.rows;

  const WD = ["日", "一", "二", "三", "四", "五", "六"];
  const nf = new Intl.NumberFormat("zh-TW");
  const money = n => nf.format(Math.round(n));

  // 每列預先組一份小寫搜尋字串，1700 列即時篩選才不會卡
  ROWS.forEach(r => {
    r._s = [r.n, r.sp, r.k, r.vk, r.doc, r.nt, r.st,
            VENDORS[r.v][0], VENDORS[r.v][1]].join(" ").toLowerCase();
    r._nosrc = r.s.length === 0;
    r._pending = /待|新品|未入檔|保留/.test(r.st);
  });

  const state = { q: "", vendor: "", range: 0, status: "" };

  const el = {
    q: document.getElementById("q"),
    vendor: document.getElementById("vendor"),
    stats: document.getElementById("stats"),
    results: document.getElementById("results"),
    meta: document.getElementById("meta"),
    toast: document.getElementById("toast")
  };

  // 廠商下拉：用簡稱顯示，依簡稱排序
  const vopts = VENDORS.map((v, i) => ({ i, full: v[0], short: v[1] }))
    .sort((a, b) => a.short.localeCompare(b.short, "zh-Hant"));
  el.vendor.innerHTML = '<option value="">全部廠商（' + VENDORS.length +
    ' 家）</option>' +
    vopts.map(v => '<option value="' + v.i + '">' + esc(v.short) +
      "</option>").join("");

  const hasCloud = SRCS.some(s => s[1].indexOf("http") === 0);
  const dates = ROWS.map(r => r.d);
  const minD = dates.length ? dates.reduce((a, b) => a < b ? a : b) : "";
  const maxD = dates.length ? dates.reduce((a, b) => a > b ? a : b) : "";
  el.meta.textContent = ROWS.length.toLocaleString() + " 筆入庫紀錄　·　" +
    VENDORS.length + " 家廠商　·　" + fmtD(minD) + " – " + fmtD(maxD) +
    "　·　更新於 " + GENERATED;

  if (!hasCloud && SRCS.length) {
    const n = document.createElement("div");
    n.className = "localnote";
    n.innerHTML = "<div><b>單據連結目前指向本機路徑。</b>" +
      "點「原始單據」會複製檔案路徑到剪貼簿，不會直接開啟。" +
      "接上雲端硬碟檔案 ID 後就會變成可直接點開的連結。</div>";
    el.stats.parentNode.insertBefore(n, el.stats);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g,
      c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",
              '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtD(d) {
    return d ? d.slice(0, 4) + "/" + d.slice(4, 6) + "/" + d.slice(6, 8) : "";
  }
  function weekday(d) {
    const dt = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
    return isNaN(dt) ? "" : "週" + WD[dt.getDay()];
  }
  function cutoff(days) {
    const t = new Date();
    t.setDate(t.getDate() - days);
    return t.getFullYear() +
      String(t.getMonth() + 1).padStart(2, "0") +
      String(t.getDate()).padStart(2, "0");
  }
  function statusClass(st) {
    if (!st) return "mute";
    if (/新品|未入檔/.test(st)) return "alert";
    if (/待|保留|中把握|低把握/.test(st)) return "warn";
    return "";
  }

  function filtered() {
    const q = state.q.trim().toLowerCase();
    const terms = q ? q.split(/\s+/) : [];
    const from = state.range ? cutoff(state.range) : "";
    return ROWS.filter(r => {
      if (from && r.d < from) return false;
      if (state.vendor !== "" && r.v !== +state.vendor) return false;
      if (state.status === "pending" && !r._pending) return false;
      if (state.status === "nosrc" && !r._nosrc) return false;
      for (let i = 0; i < terms.length; i++) {
        if (r._s.indexOf(terms[i]) === -1) return false;
      }
      return true;
    });
  }

  function renderStats(rows) {
    const qty = rows.reduce((s, r) => s + r.q, 0);
    const amt = rows.reduce((s, r) => s + r.a, 0);
    const pend = rows.reduce((s, r) => s + (r._pending ? 1 : 0), 0);
    const days = new Set(rows.map(r => r.d)).size;
    el.stats.innerHTML =
      stat("筆數", nf.format(rows.length) + " 筆",
           days + " 個入庫日") +
      stat("總數量", nf.format(qty)) +
      stat("總金額", "$" + money(amt)) +
      stat("待覆核", nf.format(pend) + " 筆", "", pend > 0);
  }
  function stat(k, val, sub, flag) {
    return '<div class="stat' + (flag ? " flag" : "") + '"><div class="k">' +
      esc(k) + '</div><div class="val">' + esc(val) + "</div></div>";
  }

  function renderRows(rows) {
    if (!rows.length) {
      el.results.innerHTML = '<div class="empty"><strong>沒有符合的紀錄</strong>' +
        "換個關鍵字，或把期間放寬到全部。</div>";
      return;
    }
    // 依日期分組（ROWS 已是日期新到舊）
    const groups = [];
    let cur = null;
    for (const r of rows) {
      if (!cur || cur.d !== r.d) { cur = { d: r.d, items: [] }; groups.push(cur); }
      cur.items.push(r);
    }

    const openN = state.q || state.vendor !== "" || state.status ? 999 : 3;
    el.results.innerHTML = groups.map((g, gi) => {
      const qty = g.items.reduce((s, r) => s + r.q, 0);
      const amt = g.items.reduce((s, r) => s + r.a, 0);
      return '<details class="day"' + (gi < openN ? " open" : "") + ">" +
        "<summary>" +
        '<svg class="caret" width="10" height="10" viewBox="0 0 10 10" ' +
        'fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'aria-hidden="true"><path d="m3.5 1.5 4 3.5-4 3.5"/></svg>' +
        '<span class="date">' + fmtD(g.d) + "</span>" +
        '<span class="wd">' + weekday(g.d) + "</span>" +
        '<span class="tally">' + g.items.length + " 品項　·　" +
        nf.format(qty) + " 件　·　$" + money(amt) + "</span>" +
        "</summary>" +
        '<div class="tablewrap"><table><thead><tr>' +
        "<th>貨號</th><th>品名 / 規格</th><th>單據號碼</th>" +
        '<th class="num">數量</th><th class="num">單價</th>' +
        '<th class="num">金額</th><th>狀態</th><th>原始單據</th>' +
        "</tr></thead><tbody>" +
        byVendor(g.items) +
        "</tbody></table></div></details>";
    }).join("");
  }

  // 同一天之內依廠商分段，每段前面插一列廠商標題
  function byVendor(items) {
    const segs = [];
    let cur = null;
    for (const r of items) {
      if (!cur || cur.v !== r.v) { cur = { v: r.v, rows: [] }; segs.push(cur); }
      cur.rows.push(r);
    }
    return segs.map(s => {
      const qty = s.rows.reduce((a, r) => a + r.q, 0);
      const amt = s.rows.reduce((a, r) => a + r.a, 0);
      const v = VENDORS[s.v];
      return '<tr class="vsep"><td colspan="8">' +
        '<span class="vs-name" title="' + esc(v[0]) + '">' + esc(v[1]) +
        "</span>" +
        '<span class="vs-tally">' + s.rows.length + " 品項　·　" +
        nf.format(qty) + " 件　·　$" + money(amt) + "</span>" +
        "</td></tr>" + s.rows.map(rowHTML).join("");
    }).join("");
  }

  function rowHTML(r) {
    // 只對到日期、沒對到單號的是推測，要標出來，不然會誤導
    const guess = r.m === "date";
    const many = r.s.length > 1;
    const srcs = r.s.length
      ? (guess ? '<div class="guesshint">同日單據（未比對到單號）</div>' : "") +
        r.s.map(i => {
          const s = SRCS[i], cloud = s[1].indexOf("http") === 0;
          // 一列有多份時要看得出差別，就用檔名；只有一份就用固定字樣
          const label = many ? esc(s[2]) : (cloud ? "開啟單據" : "複製路徑");
          const cls = "srcbtn" + (guess ? " guess" : "");
          return cloud
            ? '<a class="' + cls + '" href="' + esc(s[1]) +
              '" target="_blank" rel="noopener" title="' + esc(s[0]) +
              '">📄 ' + label + "</a>"
            : '<button class="' + cls + '" data-copy="' + esc(s[1]) +
              '" title="' + esc(s[0]) + '">📄 ' + label + "</button>";
        }).join("")
      : '<span class="srcbtn none">未歸檔</span>';

    return "<tr>" +
      '<td class="sku">' + esc(r.k || "—") +
        (r.vk ? '<span class="vk">' + esc(r.vk) + "</span>" : "") + "</td>" +
      "<td><div class=\"pname\">" + esc(r.n) + "</div>" +
        (r.sp ? '<div class="pspec">' + esc(r.sp) + "</div>" : "") +
        // 規格欄本來就常帶效期，重複的就不再列一次
        (r.e && r.sp.indexOf(r.e) === -1
          ? '<div class="pspec">效期 ' + esc(r.e) + "</div>" : "") +
        (r.nt ? '<details class="notewrap"><summary>備註</summary><p>' +
          esc(r.nt) + "</p></details>" : "") + "</td>" +
      '<td><div class="doc">' + esc(r.doc || "—") + "</div></td>" +
      '<td class="num">' + nf.format(r.q) + (r.u ? " " + esc(r.u) : "") + "</td>" +
      '<td class="num">' + (r.p ? nf.format(r.p) : "—") + "</td>" +
      '<td class="num">' + (r.a ? "$" + money(r.a) : "—") + "</td>" +
      '<td><span class="tag ' + statusClass(r.st) + '">' +
        esc(r.st || "—") + "</span></td>" +
      "<td>" + srcs + "</td>" +
      "</tr>";
  }

  function render() {
    const rows = filtered();
    renderStats(rows);
    renderRows(rows);
  }

  let timer = null;
  el.q.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = el.q.value; render(); }, 130);
  });
  el.vendor.addEventListener("change", () => {
    state.vendor = el.vendor.value; render();
  });
  document.querySelectorAll(".chip[data-range]").forEach(b => {
    b.addEventListener("click", () => {
      state.range = +b.dataset.range;
      document.querySelectorAll(".chip[data-range]").forEach(o =>
        o.setAttribute("aria-pressed", String(o === b)));
      render();
    });
  });
  document.querySelectorAll(".chip[data-status]").forEach(b => {
    b.addEventListener("click", () => {
      const on = b.getAttribute("aria-pressed") === "true";
      document.querySelectorAll(".chip[data-status]").forEach(o =>
        o.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", String(!on));
      state.status = on ? "" : b.dataset.status;
      render();
    });
  });

  el.results.addEventListener("click", ev => {
    const btn = ev.target.closest("[data-copy]");
    if (!btn) return;
    const path = btn.dataset.copy.replace(/^file:\/\//, "");
    navigator.clipboard.writeText(decodeURI(path)).then(
      () => toast("已複製檔案路徑，貼到 Finder「前往」即可開啟"),
      () => toast("複製失敗，請手動選取路徑")
    );
  });

  let ttimer = null;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(ttimer);
    ttimer = setTimeout(() => el.toast.classList.remove("show"), 2600);
  }

  render();
  }
})();
</script>
